<title>Штаб — AKU Automation</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&f[]=gambetta@400,500,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121110;
  --bg-2:#171614;
  --surface:rgba(255,255,255,.035);
  --surface-2:rgba(255,255,255,.055);
  --line:rgba(242,237,228,.10);
  --line-2:rgba(242,237,228,.18);
  --paper:#F2EDE4;
  --paper-dim:rgba(242,237,228,.62);
  --paper-mute:rgba(242,237,228,.38);
  --brass:#C8A24A;
  --brass-soft:rgba(200,162,74,.14);
  --sage:#7FA88B;
  --sage-soft:rgba(127,168,139,.14);
  --clay:#C25B4E;
  --clay-soft:rgba(194,91,78,.14);
  --r:14px;
  --sans:'Satoshi','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Gambetta','Iowan Old Style',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--paper);font-family:var(--sans);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  min-height:100vh;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 500px at 12% -5%, rgba(200,162,74,.10), transparent 60%),
    radial-gradient(700px 500px at 100% 0%, rgba(127,168,139,.06), transparent 60%);
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}
::selection{background:var(--brass);color:#16140f}

/* ---------- LOCK SCREEN ---------- */
#lock{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px}
#lock .box{width:100%;max-width:330px;text-align:center}
#lock .mark{font-family:var(--serif);font-size:40px;letter-spacing:-.02em;margin-bottom:6px}
#lock p{color:var(--paper-mute);font-size:13px;margin-bottom:22px}
#lock input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;text-align:center;letter-spacing:.2em}
#lock input::placeholder{letter-spacing:normal;color:var(--paper-mute)}
#lock button{width:100%;margin-top:10px;background:var(--brass);color:#16140f;font-weight:700;border-radius:12px;padding:13px}
#lock .err{color:var(--clay);font-size:13px;height:18px;margin-top:10px}

/* ---------- SHELL ---------- */
.shell{position:relative;z-index:1;display:none;min-height:100vh}
.shell.on{display:block}
@media(min-width:960px){.shell.on{display:grid;grid-template-columns:232px 1fr}}

/* rail */
.rail{display:none;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;background:rgba(18,17,16,.6);backdrop-filter:blur(14px)}
@media(min-width:960px){.rail{display:block}}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 10px 20px}
.brand b{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:-.02em}
.brand span{font-size:10.5px;color:var(--paper-mute);letter-spacing:.14em}
.navlink{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border-radius:10px;color:var(--paper-dim);font-size:14px;font-weight:500;transition:background .18s,color .18s}
.navlink:hover{background:var(--surface);color:var(--paper)}
.navlink.on{background:var(--brass-soft);color:var(--paper)}
.navlink svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.navlink .badge{margin-left:auto;font-size:11px;font-weight:700;color:var(--clay)}
.railfoot{margin-top:18px;padding:14px 10px 0;border-top:1px solid var(--line);font-size:11.5px;color:var(--paper-mute);line-height:1.7}

/* topbar mobile */
.mhead{position:sticky;top:0;z-index:40;background:rgba(18,17,16,.92);backdrop-filter:blur(16px);padding-top:env(safe-area-inset-top)}
@media(min-width:960px){.mhead{display:none}}
.topbar{display:flex;align-items:center;gap:10px;padding:13px 16px}
.topbar b{font-family:var(--serif);font-size:20px;font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;border-bottom:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:7px 13px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--paper-dim)}
.tab.on{background:var(--brass);border-color:var(--brass);color:#16140f;font-weight:700}

main{padding:24px 16px calc(80px + env(safe-area-inset-bottom));max-width:1180px;width:100%}
@media(min-width:960px){main{padding:34px 40px 80px}}

/* ---------- TYPE ---------- */
.h1{font-family:var(--serif);font-size:clamp(28px,4.4vw,40px);font-weight:500;letter-spacing:-.025em;line-height:1.1}
.h2{font-family:var(--serif);font-size:21px;font-weight:500;letter-spacing:-.02em}
.sub{color:var(--paper-mute);font-size:13px}
.num{font-family:var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- COMPONENTS ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;backdrop-filter:blur(10px)}
.card.tight{padding:14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrap{flex-wrap:wrap}
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:34px 0 14px;flex-wrap:wrap}
.sechead:first-child{margin-top:0}

.btn{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-size:13px;font-weight:500;color:var(--paper-dim);transition:border-color .18s,color .18s,background .18s}
.btn:hover{border-color:var(--line-2);color:var(--paper)}
.btn.gold{background:var(--brass);border-color:var(--brass);color:#16140f;font-weight:700}
.btn.gold:hover{filter:brightness(1.08);color:#16140f}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.danger:hover{border-color:var(--clay);color:var(--clay)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid var(--line)}
.pill.gold{background:var(--brass-soft);border-color:rgba(200,162,74,.3);color:var(--brass)}
.pill.sage{background:var(--sage-soft);border-color:rgba(127,168,139,.3);color:var(--sage)}
.pill.clay{background:var(--clay-soft);border-color:rgba(194,91,78,.3);color:var(--clay)}
.pill.mute{color:var(--paper-mute)}

.bar{height:5px;border-radius:999px;background:rgba(242,237,228,.09);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brass),#E0C177);width:0;transition:width 1.1s cubic-bezier(.22,1,.36,1)}
.bar.sage i{background:linear-gradient(90deg,var(--sage),#A9C9B3)}

.stat{padding:15px}
.stat .lbl{font-size:12px;color:var(--paper-mute);margin-bottom:7px}
.stat .val{font-family:var(--serif);font-size:27px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.stat .hint{font-size:11.5px;color:var(--paper-mute);margin-top:6px}

.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);transition:border-color .18s}
.item:hover{border-color:var(--line-2)}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600;font-size:14px}
.item .d{font-size:12.5px;color:var(--paper-mute);margin-top:2px}
.item .acts{display:flex;gap:6px;opacity:.55;transition:opacity .18s}
.item:hover .acts{opacity:1}

.empty{border:1px dashed var(--line-2);border-radius:12px;padding:22px;text-align:center;color:var(--paper-mute);font-size:13.5px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;color:var(--paper-mute);font-weight:600;padding:0 10px 9px;white-space:nowrap}
td{padding:11px 10px;border-top:1px solid var(--line);vertical-align:middle}
.tscroll{overflow-x:auto;scrollbar-width:thin}

/* hero */
.hero{padding:6px 0 4px}
.hero .line{font-family:var(--serif);font-size:clamp(30px,5.6vw,52px);font-weight:500;letter-spacing:-.03em;line-height:1.08}
.hero .line em{font-style:normal;color:var(--brass)}
.w{display:inline-block;opacity:0;filter:blur(7px);transform:translateY(.28em);animation:word .75s cubic-bezier(.22,1,.36,1) forwards}
@keyframes word{to{opacity:1;filter:blur(0);transform:none}}
.hero .say{margin-top:14px;color:var(--paper-dim);font-size:15px;max-width:62ch;opacity:0;animation:word .7s .5s cubic-bezier(.22,1,.36,1) forwards}

.view{display:none}
.view.on{display:block;animation:enter .42s cubic-bezier(.22,1,.36,1)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* timeline */
.tl{position:relative;padding-left:28px}
.tl::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:1px;background:linear-gradient(180deg,var(--brass),rgba(242,237,228,.12) 22%,rgba(242,237,228,.12) 88%,transparent)}
.mile{position:relative;padding:0 0 22px}
.mile::before{content:'';position:absolute;left:-25px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line-2)}
.mile.done::before{background:var(--sage);border-color:var(--sage)}
.mile.now::before{background:var(--brass);border-color:var(--brass);box-shadow:0 0 0 4px var(--brass-soft)}
.mile .when{font-size:11.5px;color:var(--paper-mute);letter-spacing:.06em}
.mile .ttl{font-weight:700;font-size:15px;margin-top:2px}
.mile .txt{font-size:13px;color:var(--paper-dim);margin-top:3px;max-width:68ch}
.year{font-family:var(--serif);font-size:30px;color:var(--paper-mute);margin:8px 0 14px;letter-spacing:-.02em}

/* pipeline */
.pipe{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.col{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px;min-height:96px}
.col h4{font-size:12px;color:var(--paper-mute);font-weight:600;margin-bottom:9px;display:flex;justify-content:space-between}
.chip{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:7px;cursor:pointer;transition:border-color .18s,transform .18s}
.chip:hover{border-color:var(--brass);transform:translateX(2px)}
.chip .n{font-size:13.5px;font-weight:600}
.chip .m{font-size:11.5px;color:var(--paper-mute);margin-top:2px}

/* sparkline */
.spark{width:100%;height:38px;display:block;overflow:visible}

/* modal */
.mask{position:fixed;inset:0;z-index:120;background:rgba(10,9,8,.72);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;padding:0}
.mask.on{display:flex}
@media(min-width:720px){.mask{align-items:center;padding:24px}}
.modal{width:100%;max-width:470px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:18px 18px 0 0;padding:20px;max-height:92vh;overflow-y:auto;animation:up .3s cubic-bezier(.22,1,.36,1)}
@media(min-width:720px){.modal{border-radius:18px}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--paper-mute);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.field textarea{min-height:76px;resize:vertical}
.field select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--paper-mute) 50%),linear-gradient(135deg,var(--paper-mute) 50%,transparent 50%);background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px;background-repeat:no-repeat}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brass);outline:none}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);z-index:190;background:var(--paper);color:#16140f;font-size:13.5px;font-weight:600;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.22,1,.36,1)}
.toast.on{opacity:1;transform:translate(-50%,0)}

.note{border-left:2px solid var(--brass);background:var(--brass-soft);border-radius:0 12px 12px 0;padding:12px 14px;font-size:13.5px;color:var(--paper-dim)}
.note.clay{border-color:var(--clay);background:var(--clay-soft)}

input[type=checkbox]{width:17px;height:17px;accent-color:var(--brass);cursor:pointer;flex:none}
.done{text-decoration:line-through;color:var(--paper-mute)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="lock">
  <div class="box">
    <div class="mark">Штаб</div>
    <p id="pwhint">AKU Automation</p>
    <input id="pw" type="password" placeholder="Код доступа" autocomplete="current-password" inputmode="numeric">
    <button id="pwgo">Войти</button>
    <div class="err" id="pwerr"></div>
    <button id="pwreset" style="background:none;color:var(--paper-mute);font-size:12px;margin-top:14px;font-weight:400;padding:6px">Забыл код</button>
  </div>
</div>

<div class="shell" id="shell">
  <aside class="rail">
    <div class="brand"><b>Штаб</b><span>AKU</span></div>
    <nav id="rail-nav"></nav>
    <div class="railfoot">
      <div id="rf-date"></div>
      <div id="rf-cur" style="margin-top:6px"></div>
      <button class="btn sm" style="margin-top:10px;width:100%" onclick="exportData()">Скачать копию данных</button>
      <button class="btn sm" style="margin-top:6px;width:100%" onclick="document.getElementById('imp').click()">Загрузить данные</button>
      <button class="btn sm" style="margin-top:6px;width:100%" onclick="lockNow()">Выйти</button>
    </div>
  </aside>

  <div>
    <div class="mhead">
    <div class="topbar">
      <b>Штаб</b>
      <button class="btn sm" style="margin-left:auto" id="curbtn2"></button>
      <button class="btn sm" onclick="lockNow()">Выйти</button>
    </div>
    <div class="tabs" id="tabs"></div>
    </div>
    <main id="main"></main>
  </div>
</div>

<input type="file" id="imp" accept="application/json,.json" style="display:none">
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ХРАНИЛИЩЕ
   Сейчас данные лежат в браузере (localStorage).
   Следующий шаг — Supabase: меняется только save()/load().
   ============================================================ */
const KEY='aku.hq.v1';
const uid=()=>Math.random().toString(36).slice(2,9);

const iso0=()=>new Date().toISOString().slice(0,10);
const SEED={
  updated:null,lastOpen:null,streak:0,lastExport:null,
  socialsChecked:iso0(),
  goal:{net:1500,subs:5,subPrice:150},
  reserve:0,
  tasks:[],income:[],expenses:[],clients:[],ads:[],socials:[],
  products:[],projects:[],partners:[],team:[],risks:[],ideas:[],wishes:[],roadmap:[]
};

let S=load(),CUR='USD',RATES={USD:1,RUB:95,BYN:3.2};

function load(){try{const r=localStorage.getItem(KEY);if(!r)return structuredClone(SEED);return Object.assign(structuredClone(SEED),JSON.parse(r));}catch(e){return structuredClone(SEED);}}
function save(){S.updated=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(S));}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1900);}

/* ---------- ВАЛЮТА ---------- */
const SYM={USD:'$',RUB:'₽',BYN:'Br'};
async function rates(){
  try{
    const c=JSON.parse(localStorage.getItem('aku.rates')||'null');
    if(c&&Date.now()-c.t<43200000){RATES=c.r;return;}
    const r=await fetch('https://open.er-api.com/v6/latest/USD');const j=await r.json();
    if(j&&j.rates){RATES={USD:1,RUB:j.rates.RUB||95,BYN:j.rates.BYN||3.2};localStorage.setItem('aku.rates',JSON.stringify({t:Date.now(),r:RATES}));}
  }catch(e){}
  paintCur();
}
function money(usd,dec){
  const v=(usd||0)*RATES[CUR];
  const s=v.toLocaleString('ru-RU',{maximumFractionDigits:dec===undefined?0:dec});
  return CUR==='USD'?'$'+s:s+' '+SYM[CUR];
}
function cycleCur(){CUR=CUR==='USD'?'RUB':CUR==='RUB'?'BYN':'USD';localStorage.setItem('aku.cur',CUR);paintCur();render();}
function paintCur(){
  const lbl='Валюта: '+CUR+' · 1 $ = '+RATES.RUB.toFixed(1)+' ₽ / '+RATES.BYN.toFixed(2)+' Br';
  const a=document.getElementById('rf-cur');if(a)a.innerHTML='<button class="btn sm" style="width:100%" onclick="cycleCur()">'+lbl+'</button>';
  const b=document.getElementById('curbtn2');if(b){b.textContent=CUR;b.onclick=cycleCur;}
}

/* ---------- ДАТЫ И РАСЧЁТЫ ---------- */
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONS=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const today=()=>new Date();
const iso=d=>d.toISOString().slice(0,10);
const ru=s=>{const d=new Date(s);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();};
const daysTo=s=>Math.ceil((new Date(s)-today())/86400000);
const ym=s=>s.slice(0,7);
const curYM=()=>iso(today()).slice(0,7);

function monthIncome(k){return S.income.filter(i=>ym(i.date)===(k||curYM())).reduce((a,b)=>a+ +b.amt,0);}
function monthExpense(){return S.expenses.reduce((a,b)=>a+(b.per==='year'? +b.amt/12 : +b.amt),0);}
function monthAds(k){return S.ads.filter(a=>ym(a.date)===(k||curYM())).reduce((a,b)=>a+ +b.spend,0);}
function mrr(){return S.clients.reduce((a,b)=>a+ +(b.mrr||0),0);}
function mrrTarget(){return S.goal.subs*S.goal.subPrice;}
function activeClients(){return S.clients.filter(c=>c.stage==='deal'||c.stage==='sub').length;}
function profit(){return monthIncome()-monthExpense()-monthAds();}
function runway(){const e=monthExpense();return e>0?(S.reserve/e):0;}
function totalAds(){return S.ads.reduce((a,b)=>a+ +b.spend,0);}
function adClients(){return S.ads.reduce((a,b)=>a+ +b.cl,0);}
function cac(){const c=adClients();return c>0?totalAds()/c:0;}

function countUp(el,to,fmt){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=fmt(to);return;}
  const t0=performance.now(),dur=900;
  (function step(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=fmt(to*e);if(p<1)requestAnimationFrame(step);})(t0);
}
function animateAll(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const to=+el.dataset.count,mode=el.dataset.mode||'money';
    countUp(el,to,v=>mode==='money'?money(v):Math.round(v).toLocaleString('ru-RU'));
  });
  requestAnimationFrame(()=>document.querySelectorAll('.bar i').forEach(b=>b.style.width=b.dataset.w+'%'));
}

/* ---------- НАВИГАЦИЯ ---------- */
const I={
  today:'<path d="M3 12h4l3 8 4-16 3 8h4"/>',
  map:'<path d="M9 4 3 7v13l6-3 6 3 6-3V4l-6 3z"/><path d="M9 4v13M15 7v13"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/>',
  money:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
  ads:'<path d="M3 11v2a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M17 9a4 4 0 0 1 0 6"/>',
  social:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5 15.4 17.5M15.4 6.5 8.6 10.5"/>',
  box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
  branch:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="12" r="3"/><path d="M6 9v6M9 18h3a3 3 0 0 0 3-3v-1"/>',
  team:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  risk:'<path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/>',
  bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.5 1 2.5h6c0-1 .4-1.9 1-2.5A6 6 0 0 0 12 3z"/>',
  flag:'<path d="M5 21V4M5 4h13l-3 4 3 4H5"/>',
  hand:'<path d="M9 15 15 9"/><path d="M11 6.5 13 4.5a3.5 3.5 0 1 1 5 5l-2 2"/><path d="M13 17.5l-2 2a3.5 3.5 0 1 1-5-5l2-2"/>'
};
const NAV=[
  ['today','Сегодня',I.today],['projects','Проекты',I.branch],['map','Карта',I.map],
  ['clients','Клиенты',I.users],['money','Деньги',I.money],['ads','Реклама',I.ads],
  ['social','Соцсети',I.social],['products','Продукты',I.box],['partners','Партнёры',I.hand],
  ['team','Команда',I.team],['risks','Риски',I.risk],['ideas','Идеи',I.bulb],['goals','Цели',I.flag]
];
let VIEW=localStorage.getItem('aku.view')||'today';

function buildNav(){
  document.getElementById('rail-nav').innerHTML=NAV.map(([k,l,ic])=>{
    const bad=k==='risks'?'<span class="badge">'+S.risks.filter(r=>r.lvl==='Высокий').length+'</span>':'';
    return '<button class="navlink'+(VIEW===k?' on':'')+'" onclick="go(\''+k+'\')"><svg viewBox="0 0 24 24">'+ic+'</svg>'+l+bad+'</button>';
  }).join('');
  const tb=document.getElementById('tabs');
  tb.innerHTML=NAV.map(([k,l])=>'<button class="tab'+(VIEW===k?' on':'')+'" onclick="go(\''+k+'\')">'+l+'</button>').join('');
  const act=tb.querySelector('.tab.on');
  if(act)requestAnimationFrame(()=>act.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'}));
}
function go(k){VIEW=k;localStorage.setItem('aku.view',k);render();window.scrollTo({top:0,behavior:'smooth'});}

/* ---------- РЕНДЕР ---------- */
function render(){
  buildNav();
  document.getElementById('main').innerHTML='<div class="view on">'+({
    today:vToday,projects:vProjects,map:vMap,clients:vClients,money:vMoney,ads:vAds,social:vSocial,
    products:vProducts,partners:vPartners,team:vTeam,risks:vRisks,ideas:vIdeas,goals:vGoals
  })[VIEW]()+'</div>';
  const d=today();
  document.getElementById('rf-date').textContent=d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();
  animateAll();
}

/* ---- СЕГОДНЯ ---- */
function vToday(){
  const inc=monthIncome(),g=S.goal.net,pct=Math.min(100,inc/g*100);
  const bd=daysTo('2026-10-01'),hz=daysTo('2030-01-01');
  const d=today(),h=d.getHours();
  const hi=h<5?'Ночь':h<12?'Доброе утро':h<18?'День':'Вечер';
  const words=(hi+', Алексей.').split(' ').map((w,i)=>'<span class="w" style="animation-delay:'+(i*.09)+'s">'+w+'</span>').join(' ');
  const line2=('Сегодня '+d.getDate()+' '+MON[d.getMonth()]+'.').split(' ').map((w,i)=>'<span class="w" style="animation-delay:'+(.25+i*.09)+'s">'+w+'</span>').join(' ');

  let say;
  if(inc===0) say='Месяц пока без оплат. Всё, что имеет значение сегодня, — довести одного человека до «да».';
  else if(inc<g) say='В месяце '+money(inc)+' из '+money(g)+'. До цели '+money(g-inc)+' — это '+Math.ceil((g-inc)/S.goal.subPrice)+' подписки или одно внедрение.';
  else say='Цель месяца закрыта: '+money(inc)+'. Теперь вопрос не «сколько», а «повторяется ли».';

  const need=Math.max(0,g-inc);
  const dleft=new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-d.getDate()+1;
  const lastCheck=daysTo(S.socialsChecked);
  const needSocial=S.socials.length>0&&lastCheck<-28;
  const needBackup=(S.income.length+S.clients.length)>0&&(!S.lastExport||daysTo(S.lastExport)<-14);

  const touch=S.clients.filter(c=>c.next&&c.stage!=='sub').slice(0,4);
  const highRisk=S.risks.filter(r=>r.lvl==='Высокий');

  return `
  <div class="hero">
    <div class="line">${words}<br><em>${line2}</em></div>
    <div class="say">${say}</div>
  </div>

  ${needSocial?`<div class="note" style="margin-top:22px">Прошло больше месяца с последнего обновления соцсетей. Кинь мне скрины статистики — пересчитаю и обновлю цифры.</div>`:''}
  ${needBackup?`<div class="note clay" style="margin-top:12px">Копия данных давно не скачивалась. Данные живут только в этом браузере — нажми «Скачать копию данных» в меню.</div>`:''}

  <div class="sechead"><div class="h2">Пульс месяца</div><div class="sub">${dleft} ${plural(dleft,'день','дня','дней')} до конца месяца${S.streak>1?' · заходишь '+S.streak+' '+plural(S.streak,'день','дня','дней')+' подряд':''}</div></div>
  <div class="grid g4">
    <div class="card stat"><div class="lbl">Доход месяца</div><div class="val" data-count="${inc}">—</div><div class="hint">цель ${money(g)}</div></div>
    <div class="card stat"><div class="lbl">Подписки (MRR)</div><div class="val" data-count="${mrr()}">—</div><div class="hint">цель ${money(mrrTarget())}</div></div>
    <div class="card stat"><div class="lbl">Прибыль месяца</div><div class="val" data-count="${profit()}" style="color:${profit()>=0?'var(--sage)':'var(--clay)'}">—</div><div class="hint">расходы ${money(monthExpense())}</div></div>
    <div class="card stat"><div class="lbl">Резерв</div><div class="val" data-count="${S.reserve}">—</div><div class="hint">хватит на ${runway().toFixed(1)} мес</div></div>
  </div>

  <div class="card" style="margin-top:12px">
    <div class="between" style="margin-bottom:10px"><div style="font-weight:700;font-size:14px">Путь к ${money(g)}</div><div class="sub">${Math.round(pct)}%</div></div>
    <div class="bar"><i data-w="${pct}"></i></div>
    <div class="sub" style="margin-top:10px">Не хватает ${money(need)}. Это ${Math.ceil(need/S.goal.subPrice)} подписки по ${money(S.goal.subPrice)} или одно внедрение.</div>
  </div>

  ${taskBlock()}

  ${focusBlock()}

  <div class="grid g2" style="margin-top:12px">
    <div class="card">
      <div class="between" style="margin-bottom:12px"><div class="h2">Кому написать</div><button class="btn sm" onclick="go('clients')">Клиенты</button></div>
      <div class="list">
        ${touch.length?touch.map(c=>`<div class="item"><div class="body"><div class="t">${esc(c.name)}</div><div class="d">${esc(c.next)}</div></div><span class="pill ${stagePill(c.stage)}">${STAGES[c.stage]}</span></div>`).join(''):'<div class="empty">Все шаги закрыты.</div>'}
      </div>
    </div>
    <div class="card">
      <div class="between" style="margin-bottom:12px"><div class="h2">Красные флаги</div><button class="btn sm" onclick="go('risks')">Все риски</button></div>
      <div class="list">
        ${highRisk.length?highRisk.slice(0,3).map(r=>`<div class="item"><div class="body"><div class="t">${esc(r.t)}</div><div class="d">${esc(r.act)}</div></div></div>`).join(''):'<div class="empty">Высоких рисков нет.</div>'}
      </div>
    </div>
  </div>

  <div class="grid g2" style="margin-top:12px">
    <div class="card stat"><div class="lbl">До дня рождения</div><div class="val">${bd} ${plural(bd,'день','дня','дней')}</div><div class="hint">1 октября 2026 — 21 год</div></div>
    <div class="card stat"><div class="lbl">До 1 января 2030</div><div class="val">${hz.toLocaleString('ru-RU')} ${plural(hz,'день','дня','дней')}</div><div class="hint">своя IT-компания или стартап</div></div>
  </div>`;
}
function taskDone(t){return t.rep? t.doneOn===iso(today()) : !!t.done;}
function toggleTask(id){
  const t=S.tasks.find(x=>x.id===id),d=iso(today());
  if(t.rep)t.doneOn=t.doneOn===d?'':d; else t.done=!t.done;
  save();render();
}
function pullTails(){const d=iso(today());S.tasks.forEach(t=>{if(!t.rep&&t.d&&t.d<d&&!t.done)t.d=d;});save();render();toast('Перенёс на сегодня');}
function taskBlock(){
  const d=iso(today());
  const now=S.tasks.filter(t=>t.rep||!t.d||t.d===d);
  const tails=S.tasks.filter(t=>!t.rep&&t.d&&t.d<d&&!t.done);
  const left=now.filter(t=>!taskDone(t)).length;
  const row=t=>`<div class="item">
      <input type="checkbox" ${taskDone(t)?'checked':''} onchange="toggleTask('${t.id}')">
      <div class="body"><div class="t ${taskDone(t)?'done':''}">${esc(t.t)}</div>${t.rep?'<div class="d">каждый день</div>':''}</div>
      <div class="acts"><button class="btn sm" onclick="edit('tasks','${t.id}')">Правка</button><button class="btn sm danger" onclick="del('tasks','${t.id}')">Удалить</button></div>
    </div>`;
  return `<div class="sechead"><div class="h2">Сегодня делаю</div>
    <div class="row"><span class="sub">${now.length?(left?'осталось '+left:'всё закрыто'):''}</span><button class="btn sm" onclick="edit('tasks')">Добавить</button></div></div>
  <div class="list">${now.length?now.map(row).join(''):'<div class="empty">Пусто. Напиши одно дело, которое двигает деньги.</div>'}</div>

function spark(h){
  if(h.length<2)return '<div class="sub" style="margin-top:10px;font-size:11.5px">График появится со второй отметкой</div>';
  const vs=h.map(x=>x.v),mn=Math.min(...vs),mx=Math.max(...vs),rg=mx-mn||1;
  const pts=vs.map((v,i)=>[(i/(vs.length-1))*100,34-((v-mn)/rg)*28]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 100 38" preserveAspectRatio="none" style="margin-top:12px"><path d="${d}" fill="none" stroke="var(--brass)" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linecap="round"/></svg>`;
}
function bumpSocial(id){
  const s=S.socials.find(x=>x.id===id);
  openModal(s.name,[{k:'v',l:'Подписчиков сейчас',t:'number',v:s.subs}],v=>{
    s.subs=+v.v;s.hist.push({d:iso(today()),v:+v.v});if(s.hist.length>24)s.hist.shift();
    S.socialsChecked=iso(today());save();render();toast('Записал');
  });
}
function editMetrics(id){
  const s=S.socials.find(x=>x.id===id);
  const txt=Object.entries(s.m||{}).map(([k,v])=>k+': '+v).join('\n');

    const o={};v.m.split('\n').forEach(l=>{const i=l.indexOf(':');if(i>0)o[l.slice(0,i).trim()]=l.slice(i+1).trim();});

    ${p.next?`<div style="font-size:13px;margin-top:8px;color:var(--brass)">Следующий шаг: ${esc(p.next)}</div>`:''}
    ${steps.length?`<div class="bar" style="margin-top:12px"><i data-w="${dn/steps.length*100}"></i></div>
      <div class="sub" style="margin-top:6px">${dn} из ${steps.length} шагов</div>

        <div class="body"><div class="t ${s.done?'done':''}" style="font-size:13px;font-weight:500">${esc(s.t)}</div></div>
        <div class="acts"><button class="btn sm danger" onclick="stepDel('${p.id}',${i})">Убрать</button></div></div>`).join('')}</div>`:''}
    <div class="row wrap" style="margin-top:12px;gap:6px">
      <button class="btn sm" onclick="stepAdd('${p.id}')">Добавить шаг</button>

      <button class="btn sm danger" onclick="del('projects','${p.id}')">Удалить</button>
    </div></div>`;
}
function stepToggle(id,i){const p=S.projects.find(x=>x.id===id);p.steps[i].done=!p.steps[i].done;save();render();}
function stepDel(id,i){const p=S.projects.find(x=>x.id===id);p.steps.splice(i,1);save();render();}
function stepAdd(id){
  const p=S.projects.find(x=>x.id===id);
  openModal('Шаг проекта',[{k:'t',l:'Что сделать',t:'text'}],v=>{
    if(!v.t)return;p.steps=p.steps||[];p.steps.push({t:v.t,done:false});save();render();
  });
}
function focusBlock(){

}

const LIST={tasks:'tasks',clients:'clients',income:'income',expenses:'expenses',ads:'ads',products:'products',projects:'projects',partners:'partners',team:'team',risks:'risks',ideas:'ideas',wishes:'wishes',roadmap:'roadmap',socials:'socials'};

function edit(type,id){
  const sc=SCHEMA[type],arr=S[LIST[type]];
  const rec=id?arr.find(x=>x.id===id):null;
  const fields=sc.f.map(f=>Object.assign({},f,{v:rec?rec[f.k]:(f.t==='date'?iso(today()):'')}));
  openModal(rec?sc.title+' — правка':sc.title,fields,v=>{
    sc.f.forEach(f=>{if(f.t==='number')v[f.k]=+v[f.k]||0;});
    if(rec)Object.assign(rec,v);
    else arr.push(sc.mk?sc.mk(v):Object.assign({id:uid()},v));
    save();render();toast(rec?'Сохранено':'Добавлено');
  },rec?()=>{del(type,id,true);}:null);
}
function del(type,id,silent){
  if(!silent&&!confirm('Удалить запись?'))return;
  const k=LIST[type];S[k]=S[k].filter(x=>x.id!==id);save();closeModal();render();toast('Удалено');
}
function openModal(title,fields,onSave,onDelete){
  const m=document.getElementById('modal');
  m.innerHTML='<div class="between" style="margin-bottom:16px"><div class="h2">'+esc(title)+'</div><button class="btn sm" onclick="closeModal()">Закрыть</button></div>'
    +fields.map(f=>{
      const v=f.v===undefined||f.v===null?'':f.v;
      if(f.t==='select')return '<div class="field"><label>'+f.l+'</label><select id="f_'+f.k+'">'+f.o.map(o=>'<option value="'+o.v+'"'+(String(v)===String(o.v)?' selected':'')+'>'+o.l+'</option>').join('')+'</select></div>';
      if(f.t==='textarea')return '<div class="field"><label>'+f.l+'</label><textarea id="f_'+f.k+'">'+esc(String(v))+'</textarea></div>';
      return '<div class="field"><label>'+f.l+'</label><input id="f_'+f.k+'" type="'+f.t+'" value="'+esc(String(v))+'"></div>';
    }).join('')
    +'<div class="row" style="margin-top:16px;gap:8px"><button class="btn gold" style="flex:1" id="msave">Сохранить</button>'
    +(onDelete?'<button class="btn danger" id="mdel">Удалить</button>':'')+'</div>';
  document.getElementById('msave').onclick=()=>{
    const v={};fields.forEach(f=>v[f.k]=document.getElementById('f_'+f.k).value);
    closeModal();onSave(v);
  };
  if(onDelete)document.getElementById('mdel').onclick=onDelete;
  document.getElementById('mask').classList.add('on');
  setTimeout(()=>{const i=m.querySelector('input,textarea,select');if(i&&window.innerWidth>720)i.focus();},60);
}
function closeModal(){document.getElementById('mask').classList.remove('on');}
document.getElementById('mask').addEventListener('click',e=>{if(e.target.id==='mask')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ---------- УТИЛИТЫ ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c;}
function exportData(){
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='aku-hq-'+iso(today())+'.json';a.click();
  S.lastExport=iso(today());save();toast('Копия скачана');
}
function lockNow(){sessionStorage.removeItem('aku.ok');location.reload();}

/* ---------- ВХОД ---------- */
const PINKEY='aku.pin';
async function sha(s){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('aku-hq|'+s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function greet(){const x=today().getHours();return x<5?'Ночь на дворе':x<12?'Доброе утро':x<18?'Добрый день':'Добрый вечер';}
function makeManifest(){
  try{
    const ic=document.querySelector('link[rel="icon"]').href;
    const m={name:'Штаб — AKU Automation',short_name:'Штаб',start_url:location.pathname,scope:location.pathname,
      display:'standalone',orientation:'portrait',background_color:'#121110',theme_color:'#121110',
      icons:[{src:ic,sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
    document.getElementById('mf').href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
  }catch(e){}
}
function unlock(){
  document.getElementById('lock').style.display='none';
  document.getElementById('shell').classList.add('on');
  CUR=localStorage.getItem('aku.cur')||'USD';
  const t=iso(today()),y=new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(S.lastOpen!==t){S.streak=S.lastOpen===y?(S.streak||0)+1:1;S.lastOpen=t;VIEW='today';localStorage.setItem('aku.view','today');save();}
  makeManifest();paintCur();rates();render();
  setTimeout(()=>toast(greet()+', Алексей'),450);
}
function lockMode(){
  const has=localStorage.getItem(PINKEY);
  document.getElementById('pwhint').textContent=has?'AKU Automation':'Придумай код — он сохранится на этом устройстве';
  document.getElementById('pw').placeholder=has?'Код доступа':'Новый код, от 4 знаков';
  document.getElementById('pwgo').textContent=has?'Войти':'Сохранить код';
  document.getElementById('pwreset').style.display=has?'block':'none';
}
async function tryEnter(){
  const el=document.getElementById('pw'),v=el.value,err=document.getElementById('pwerr'),has=localStorage.getItem(PINKEY);
  if(!has){
    if(v.length<4){err.textContent='Минимум 4 знака';return;}
    localStorage.setItem(PINKEY,await sha(v));sessionStorage.setItem('aku.ok','1');unlock();return;
  }
  if(await sha(v)===has){sessionStorage.setItem('aku.ok','1');unlock();}
  else{err.textContent='Код не подошёл';el.value='';}
}
document.getElementById('pwgo').onclick=tryEnter;
document.getElementById('pwreset').onclick=()=>{
  if(!confirm('Код сбрасывается только вместе с данными этого устройства. Если копия не скачана, всё пропадёт. Продолжить?'))return;
  if(!confirm('Точно удалить данные и код?'))return;
  localStorage.removeItem(PINKEY);localStorage.removeItem(KEY);location.reload();
};
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryEnter();});
document.getElementById('imp').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!confirm('Заменить все данные в штабе содержимым файла?')){e.target.value='';return;}
      S=Object.assign(structuredClone(SEED),d);save();render();toast('Данные загружены');
    }catch(err){alert('Файл не читается — нужен .json, скачанный из штаба');}
    e.target.value='';
  };
  r.readAsText(f);
});
lockMode();
if(sessionStorage.getItem('aku.ok'))unlock();
</script>
